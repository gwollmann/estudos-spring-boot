services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pessoas_db
      POSTGRES_USER: pessoas
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the environment}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pessoas -d pessoas_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
